cv:
  role: Student <en>Software Development</en> (MBO 4)
  profileTitle: Profiel
  profile: >-
    Student <en>Software Development</en> uit Haarlem. Ik bouw apps, games en tools en wil weten
    hoe dingen werken. Tijdens mijn stage bij de Gemeente Haarlem automatiseerde ik de controle op
    testplannen met Power Automate.
  experienceTitle: Werkervaring
  educationTitle: Opleiding
  skillsTitle: Vaardigheden
  projectsTitle: Projecten
  languagesTitle: Talen
  contactTitle: Contact
  website: Website
  download: Download als PDF
  print: Print dit cv
  back: Terug naar de site
  updated: Bijgewerkt in

  experience:
    - title: Stage Functioneel Beheer
      place: Gemeente Haarlem
      period: 2026
      note: BPV-stage van 80 dagen, afgerond in oktober 2026.
      points:
        - >-
          Alle gemeentelijke applicaties geïnventariseerd op de vraag of er een testplan voor is,
          per domein en per beheerder, in één Excel-overzicht.
        - >-
          Een uniform testplansjabloon gemaakt dat de losse formats van de verschillende teams
          vervangt.
        - >-
          Met Power Automate twee <en>flows</en> gebouwd die in SharePoint controleren of er per
          applicatie een testplan staat en het overzicht automatisch bijwerken, met grafieken per
          domein.
        - Samen met functioneel beheerders testplannen opgesteld en uitgevoerd.
        - Een collega ingewerkt die het werk na mijn stage voortzet.
    - title: Snuffelstage Functioneel Beheer
      place: Gemeente Haarlem
      period: 2023
      note: In de derde klas van de mavo.
      points:
        - Medewerkers geholpen met vragen over software en interne applicaties.
        - Schakel tussen gebruikers en de technische afdeling bij problemen.
        - Nieuwe functies en updates getest voordat ze live gingen.

  education:
    - title: MBO 4 <en>Software Developer</en>
      place: Nova College, Beverwijk
      period: 2024 tot nu
      points:
        - Examens Nederlands, Engels en rekenen behaald.
        - Diploma verwacht in 2027.
    - title: VMBO-TL
      place: De Hartenlust, Bloemendaal
      period: 2020 tot 2024
      points:
        - Diploma behaald.
        - >-
          Vakken: Nederlands, Engels (met Cambridge-certificaat B2), wiskunde, IT, economie en
          aardrijkskunde.

