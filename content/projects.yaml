  nl:
    title: PC-bouwplanner
    summary: >-
      Een website om een pc samen te stellen. Hij controleert of de onderdelen bij elkaar passen,
      telt prijs en stroomverbruik op en stelt een <en>build</en> voor op basis van budget en
      doel. Een schoolproject dat ik alleen heb gemaakt.
    learned: >-
      Een database opzetten waarmee onderdelen op compatibiliteit worden gecontroleerd, en in mijn
      eentje een project van begin tot eind plannen.
  en:
    title: PC build planner
    summary: >-
      A website for putting together a PC. It checks whether the parts are compatible, adds up the
      price and power draw, and suggests a build based on budget and purpose. A school project I
      built on my own.
    learned: >-
      How to set up a database that checks whether parts fit together, and how to plan a project
      from start to finish on my own.

