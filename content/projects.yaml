- id: claudot
  featured: true
  onCv: true
  sketch: bridge
  image: TODO
  tech:
    - Python
    - GDScript
  links:
    - url: https://github.com/Claudot-Code/claudot-pub/pulls?q=is%3Apr+author%3ANiels023+is%3Amerged
      nl: <en>Pull requests</en> die gemerged zijn
      en: My merged pull requests
    - url: https://github.com/Niels023/claudot-pub
      nl: Mijn fork
      en: My fork
  nl:
    title: Bijdragen aan Claudot
    status: Open source
    summary: >-
      Claudot is een add-on voor de Godot-editor. Ik vond meerdere bugs, meldde ze als
      <en>issues</en> en loste ze op met vier <en>pull requests</en> die de <en>maintainer</en>
      heeft gemerged. Onder andere de verbinding van de <en>bridge</en> op Windows, een proces dat
      bleef draaien nadat Godot was afgesloten, en het versielabel met de link naar de
      <en>releases</en>.
    learned: >-
      Mijn weg vinden in andermans code en een bug zo beschrijven dat een ander hem kan volgen.
      En dat een <en>fix</en> soms betekent dat er code uit moet in plaats van erbij.
  en:
    title: Contributions to Claudot
    status: Open source
    summary: >-
      Claudot is an add-on for the Godot editor. I found several bugs, reported them as issues and
      fixed them in four pull requests that the maintainer merged. Among them the bridge connection
      on Windows, a process that kept running after Godot was closed, and the version label with
      its link to the releases.
    learned: >-
      Finding my way around someone else's code and describing a bug so that someone else can
      follow it. And that a fix sometimes means removing code instead of adding it.

- id: testplannen
  featured: true
  onCv: false
  sketch: checklist
  image: TODO
  tech:
    - Power Automate
    - SharePoint
    - Excel
  nl:
    title: Testplannen automatiseren bij Gemeente Haarlem
    status: Stageproject
    note: Werkproject, dus geen openbare code.
    summary: >-
      Tijdens mijn stage bouwde ik met Power Automate twee <en>flows</en> die in SharePoint
      controleren of er per applicatie een testplan staat. Ze werken het overzicht automatisch bij,
      met grafieken per domein. Ook maakte ik één sjabloon dat de losse formats van de teams
      vervangt.
    learned: >-
      Het moeilijkste was niet de techniek, maar mensen meekrijgen. Daarom heb ik de aanpak
      aangepast, zodat beheerders er minder werk aan hadden.
  en:
    title: Automating test plans at the Municipality of Haarlem
    status: Internship project
    note: Built at work, so there is no public code.
    summary: >-
      During my internship I built two Power Automate flows that check in SharePoint whether each
      application has a test plan. They keep the overview up to date automatically, with charts per
      domain. I also made a single template to replace the separate formats the teams were using.
    learned: >-
      The hard part was not the technology, it was getting people on board. So I changed the
      approach to make it less work for the application managers.

