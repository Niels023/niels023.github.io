  role: Software Development student (MBO level 4)
  profileTitle: Profile
  profile: >-
    Software Development student from Haarlem. I build apps, games and tools, and I like to know
    how things work. During my internship at the Municipality of Haarlem I automated the checks on
    test plans with Power Automate.
  experienceTitle: Work experience
