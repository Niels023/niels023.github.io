  experience:
    - title: Intern, Functional Management
      place: Municipality of Haarlem
      period: 2026
      note: An 80-day work placement, completed in October 2026.
      points:
        - >-
          Took stock of more than 150 municipal applications to see whether each had a test plan,
          developed one standard test plan template and put it to use together with application
          managers.
        - >-
          Built two Power Automate flows that check in SharePoint whether each application has a
          test plan and update the overview automatically, with charts per domain.
        - Trained a colleague who is continuing the work after my internship.
    - title: Work experience placement, Functional Management
      place: Municipality of Haarlem
      period: 2023
      note: During my third year of secondary school.
      points:
        - Helped staff with questions about software and internal applications.
        - Acted as the link between users and the technical department when problems came up.
        - Tested new features and updates before they went live.

  education:
    - title: <nl>MBO</nl> 4 Software Developer
      place: Nova College, Beverwijk
      period: 2024 to present
      points:
        - >-
          Senior secondary vocational education, <keep>level 4</keep>. Passed the exams for Dutch,
          English and maths.
        - Diploma expected in 2027.
    - title: <nl>VMBO-TL</nl>
      place: De Hartenlust, Bloemendaal
      period: 2020 to 2024
      points:
        - Pre-vocational secondary education. Diploma obtained.
        - >-
          Subjects: Dutch, English (with a Cambridge certificate at B2 level), mathematics, IT,
          economics and geography.

